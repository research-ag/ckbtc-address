[package]
name = "ckbtc-address"
version = "0.0.3"
description = "An algorithm which calculates BTC address for deposits to ckBTC minter"
repository = "https://github.com/research-ag/ckbtc-address"
keywords = [ "bitcoin", "key-derivation", "bip32", "ckbtc", "minter" ]
license = "MIT"

[dependencies]
core = "2.6.2"
bitcoin = "0.2.1"

[dev-dependencies]
test = "2.1.2"
bench-helper = "0.0.3"

[toolchain]
moc = "2.0.0"
pocket-ic = "16.1.0"
wasm-opt = "133"

[optimize]

[requirements]
moc = "1.4.0"
