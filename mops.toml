[package]
name = "ckbtc-address"
version = "0.0.1"
description = "An algorithm which calculates BTC address for deposits to ckBTC minter"
repository = "https://github.com/research-ag/ckbtc-address"
keywords = [ "bitcoin", "key-derivation", "bip32", "ckbtc", "minter" ]
license = "MIT"

[dependencies]
core = "2.3.1"
bitcoin = "0.1.1"

[dev-dependencies]
test = "2.1.2"
bench-helper = "0.0.2"

[toolchain]
moc = "1.3.0"